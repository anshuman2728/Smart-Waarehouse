# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/smart_warehouse}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${SERVER_PORT:8081}

# JWT
application.security.jwt.secret-key=8hY5J9mL2xQ7vT4kN8pR6sF1aD3gH7jK5mN2pL8vX4zQ9wE6rT1yU3iO7pA5sD9
application.security.jwt.expiration=86400000

# Default admin (seeded on first startup)
application.admin.email=${ADMIN_EMAIL:admin@smartwarehouse.com}
application.admin.password=${ADMIN_PASSWORD:Admin@123}

# Demo data configuration (opt-in via SEED_DEMO_DATA=true)
application.seed-demo-data=${SEED_DEMO_DATA:false}
application.demo-data.manager-email=${DEMO_MANAGER_EMAIL:manager@smartwarehouse.com}
application.demo-data.manager-password=${DEMO_MANAGER_PASSWORD:Manager@123}
application.demo-data.employee-email=${DEMO_EMPLOYEE_EMAIL:employee@smartwarehouse.com}
application.demo-data.employee-password=${DEMO_EMPLOYEE_PASSWORD:Employee@123}
